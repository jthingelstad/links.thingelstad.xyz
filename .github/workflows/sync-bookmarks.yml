name: Publish confirmed bookmarks
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse without credentials, imports, commits or deployment
        type: choice
        options: ['true', 'false']
        default: 'true'
permissions:
  contents: read
concurrency:
  group: public-bookmark-import
  cancel-in-progress: false
jobs:
  rehearsal:
    if: inputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Bookmark subscriber rehearsal accepted. No credentials, import, commit or deployment.'
  import:
    if: inputs.dry_run == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: node tools/bookmark-inbox.mjs
      - name: Import only verified public bookmark captures
        run: |
          python3 tools/import_bookmarks.py --inbox .build/bookmark-inbox
          npm run validate:data
          npm test
      - name: Commit only bookmark data and dispatch normal CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          git add data/derived/bookmarks.json
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$base"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import confirmed public bookmarks.'
            git push origin HEAD:main
          fi
          needed="$(JOIN_COMMIT="$(git rev-parse HEAD)" node tools/join-publication.mjs)"
          if [[ "$needed" = false ]]; then exit 0; fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
