name: Publishing bus join
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse without a join, commit or deployment
        type: choice
        options: ['true', 'false']
        default: 'true'
permissions:
  contents: read
concurrency:
  group: publishing-bus-join
  cancel-in-progress: false
jobs:
  rehearsal:
    if: inputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Publishing subscriber rehearsal accepted. No join, credentials, commit or deployment.'
  join:
    if: inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Require Jamie's explicit approval to repair the example
        env:
          APPROVED: ${{ vars.SYNC_JOIN_APPROVED }}
        run: test "$APPROVED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: links
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jthingelstad/weekly.thingelstad.com
          ref: main
          path: weekly
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci
        working-directory: links
      - name: Build and verify the generated join
        working-directory: links
        run: |
          python3 tools/join_issues.py --archive ../weekly/apps/site/archive
          npm run validate:data
          npm test
      - name: Publish only a changed generated join through normal CI
        working-directory: links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add data/derived/issues.json
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'The issue join follows the published archive.'
          git push origin HEAD:main
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
